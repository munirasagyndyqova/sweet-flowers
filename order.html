<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order - Sweet Flowers</title>
  <!-- Bootstrap v5.3.2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/order.css">
</head>
<body class="bg-light">

<header>
  <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm">
    <div class="container">
      <p class="navbar-brand mb-0 text-brand fw-bold">Sweet Flowers</p>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="flowers.html">Flowers</a></li>
          <li class="nav-item"><a class="nav-link" href="delivery.html">Delivery</a></li>
          <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Order</a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Contacts</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container my-5">
  <section class="text-center mb-4">
    <h2 class="display-6 text-brand">Place Your Order</h2>
    <p class="text-muted">Choose your flowers and provide your delivery information.</p>
  </section>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <form class="bg-white p-4 p-md-5 rounded shadow-sm border-brand">
        
        <fieldset class="mb-4">
          <legend class="h5 text-brand border-bottom pb-2">Customer Information</legend>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="name" class="form-label">Full Name:</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone Number:</label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 700 000 00 00" required>
            </div>
            <div class="col-12">
              <label for="email" class="form-label">Email:</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5 text-brand border-bottom pb-2">Choose Your Bouquet</legend>
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-8">
              <label for="flowers" class="form-label">Flower Type:</label>
              <select id="flowers" name="flowers" class="form-select">
                <option value="roses">Roses</option>
                <option value="tulips">Tulips</option>
                <option value="peonies">Peonies</option>
                <option value="mixed">Mixed Bouquet</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="quantity" class="form-label">Quantity:</label>
              <input type="number" id="quantity" name="quantity" class="form-control" min="1" max="20" value="1">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5 text-brand border-bottom pb-2">Delivery Information</legend>
          <div class="mb-3">
            <label for="address" class="form-label">Delivery Address:</label>
            <textarea id="address" name="address" class="form-control" rows="3" placeholder="Enter your delivery address" required></textarea>
          </div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="date" class="form-label">Delivery Date:</label>
              <input type="date" id="date" name="date" class="form-control">
            </div>
            <div class="col-12 col-md-6">
              <label for="time" class="form-label">Preferred Time:</label>
              <input type="time" id="time" name="time" class="form-control">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5 text-brand border-bottom pb-2">Payment Method</legend>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input type="radio" id="cash" name="payment" value="cash" class="form-check-input" checked>
              <label for="cash" class="form-check-label">Cash</label>
            </div>
            <div class="form-check">
              <input type="radio" id="card" name="payment" value="card" class="form-check-input">
              <label for="card" class="form-check-label">Card Online</label>
            </div>
            <div class="form-check">
              <input type="radio" id="kaspi" name="payment" value="kaspi" class="form-check-input">
              <label for="kaspi" class="form-check-label">Kaspi Pay</label>
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <label for="message" class="form-label">Message for the Florist:</label>
          <textarea id="message" name="message" class="form-control" rows="3" placeholder="Special requests..."></textarea>
        </fieldset>

        <!-- Buttons with variants: brand, outline, size (lg), and disabled state -->
        <div class="d-flex flex-wrap gap-2 justify-content-between">
          <div>
            <button type="submit" class="btn btn-brand btn-lg">Place Order</button>
            <button type="reset" class="btn btn-outline-secondary btn-lg">Clear</button>
          </div>
          <button type="button" class="btn btn-secondary disabled" disabled>Apply Promo (Coming Soon)</button>
        </div>
        
      </form>
    </div>
  </div>
</main>

<footer class="bg-white text-center py-3 mt-auto border-top">
  <p class="mb-0 text-muted small">&copy; 2026 Sweet Flowers</p>
</footer>

<!-- Bootstrap v5.3.2 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
