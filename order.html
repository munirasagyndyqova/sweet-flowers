<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order - Sweet Flowers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>

<header class="bg-primary py-4 shadow-sm fade-in-up">
  <div class="container">
    <h1 class="display-5 text-center text-white fw-bold mb-3">Sweet Flowers</h1>
    <nav class="navbar navbar-expand-md navbar-dark p-0">
      <button class="navbar-toggler mx-auto mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav gap-2 gap-md-4 text-center fw-semibold">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="flowers.html">Flowers</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="delivery.html">Delivery</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="my-orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="order.html">Order</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contacts.html">Contacts</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>

<main class="container my-5 fade-in-up">
  <section class="text-center mb-4">
    <h2 class="display-6 text-primary fw-bold">Place Your Order</h2>
    <p class="text-muted">Choose your flowers and provide your delivery information.</p>
  </section>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-9">
      <form class="bg-white p-4 p-md-5 rounded shadow-sm border">

        <fieldset class="mb-5">
          <legend class="h5 text-primary border-bottom pb-2 mb-3">Customer Information</legend>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="name" class="form-label fw-bold">Full Name:</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="phone" class="form-label fw-bold">Phone Number:</label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 700 000 00 00" required>
            </div>
            <div class="col-12">
              <label for="email" class="form-label fw-bold">Email:</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-5">
          <legend class="h5 text-primary border-bottom pb-2 mb-3">Choose Your Bouquet</legend>
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-8">
              <label for="flowers" class="form-label fw-bold">Flower Type:</label>
              <select id="flowers" name="flowers" class="form-select">
                <option value="roses">Roses</option>
                <option value="tulips">Tulips</option>
                <option value="peonies">Peonies</option>
                <option value="mixed">Mixed Bouquet</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="quantity" class="form-label fw-bold">Quantity:</label>
              <input type="number" id="quantity" name="quantity" class="form-control" min="1" max="20" value="1">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-5">
          <legend class="h5 text-primary border-bottom pb-2 mb-3">Delivery Information</legend>
          <div class="mb-3">
            <label for="address" class="form-label fw-bold">Delivery Address:</label>
            <textarea id="address" name="address" class="form-control" rows="3" placeholder="Enter your delivery address" required></textarea>
          </div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="date" class="form-label fw-bold">Delivery Date:</label>
              <input type="date" id="date" name="date" class="form-control">
            </div>
            <div class="col-12 col-md-6">
              <label for="time" class="form-label fw-bold">Preferred Time:</label>
              <input type="time" id="time" name="time" class="form-control">
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-5">
          <legend class="h5 text-primary border-bottom pb-2 mb-3">Payment Method</legend>
          <div class="d-flex flex-wrap gap-4">
            <div class="form-check">
              <input type="radio" id="cash" name="payment" value="cash" class="form-check-input" checked>
              <label for="cash" class="form-check-label">Cash</label>
            </div>
            <div class="form-check">
              <input type="radio" id="card" name="payment" value="card" class="form-check-input">
              <label for="card" class="form-check-label">Card Online</label>
            </div>
            <div class="form-check">
              <input type="radio" id="kaspi" name="payment" value="kaspi" class="form-check-input">
              <label for="kaspi" class="form-check-label">Kaspi Pay</label>
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-5">
          <label for="message" class="form-label fw-bold">Message for the Florist:</label>
          <textarea id="message" name="message" class="form-control" rows="3" placeholder="Special requests or notes..."></textarea>
        </fieldset>

        <div class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-center border-top pt-4">
          <div class="d-flex gap-2 w-100 w-md-auto">
            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">Place Order</button>
            <button type="reset" class="btn btn-outline-secondary btn-lg">Clear</button>
          </div>
          <button type="button" class="btn btn-light disabled text-muted w-100 w-md-auto" disabled>Apply Promo (Coming Soon)</button>
        </div>

      </form>
    </div>
  </div>
</main>

<footer class="bg-white text-center py-4 mt-auto border-top">
  <p class="mb-0 text-muted small">&copy; 2026 Sweet Flowers</p>
</footer>

</body>
</html>
